services:
  web:
    container_name: web
    image: plane-web-pespo:latest
    restart: always
    depends_on:
      - api
    networks:
      - plane-network
      - portal-cliente_proxy

  admin:
    container_name: admin
    image: plane-admin-pespo:latest
    restart: always
    depends_on:
      - api
      - web
    networks:
      - plane-network
      - portal-cliente_proxy

  space:
    container_name: space
    image: plane-space-pespo:latest
    restart: always
    depends_on:
      - api
      - web
    networks:
      - plane-network
      - portal-cliente_proxy

  api:
    container_name: api
    image: plane-api-pespo:latest
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis
    networks:
      - plane-network
      - portal-cliente_proxy

  worker:
    container_name: bgworker
    image: plane-api-pespo:latest
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-db
      - plane-redis
    networks:
      - plane-network

  beat-worker:
    container_name: beatworker
    image: plane-api-pespo:latest
    restart: always
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-db
      - plane-redis
    networks:
      - plane-network

  migrator:
    container_name: plane-migrator
    image: plane-api-pespo:latest
    restart: no
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis
    networks:
      - plane-network

  live:
    container_name: plane-live
    image: plane-live-pespo:latest
    restart: always
    environment:
      API_BASE_URL: "http://api:8000"
      LIVE_SERVER_SECRET_KEY: CHANGE_ME
      REDIS_HOST: "plane-redis"
      REDIS_PORT: "6379"
    networks:
      - plane-network
      - portal-cliente_proxy

  plane-db:
    container_name: plane-db
    image: postgres:15.7-alpine
    restart: always
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: CHANGE_ME
      PGDATA: /var/lib/postgresql/data
    networks:
      - plane-network

  plane-redis:
    container_name: plane-redis
    image: valkey/valkey:7.2.11-alpine
    restart: always
    volumes:
      - redisdata:/data
    networks:
      - plane-network

  plane-mq:
    container_name: plane-mq
    # Nome de nó fixo: sem isso o RabbitMQ usa o ID do container como hostname
    # e cada recriação sobe um nó novo (vazio) no mesmo volume.
    hostname: plane-mq
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: CHANGE_ME
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - plane-network

  plane-minio:
    container_name: plane-minio
    image: minio/minio
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: CHANGE_ME
    networks:
      - plane-network
      - portal-cliente_proxy

networks:
  plane-network:
  portal-cliente_proxy:
    external: true

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:
